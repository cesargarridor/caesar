[package]
name = "caesar"
version = "0.2.7"
description = "Caesar - cliente API rápido y seguro"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
open = "5"
tokio = { version = "1", features = ["rt", "macros", "time", "net", "fs"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart", "gzip", "deflate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
