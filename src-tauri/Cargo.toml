[package]
name = "caesar"
version = "1.0.7"
description = "Caesar - cliente API rápido y seguro"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
# Enlaces caesar:// (ver src/deeplink.rs). single-instance evita abrir una segunda ventana al pulsar un enlace en Windows/Linux.
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
open = "5"
tokio = { version = "1", features = ["rt", "macros", "time", "net", "fs", "io-util", "sync"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "multipart", "gzip", "deflate"] }

# WebSockets (ver src/ws.rs): mismo stack TLS que reqwest (rustls + ring + webpki-roots)
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"

# Lectura de CSV del Collection Runner (ver src/runner.rs)
csv = "1"

# Compresión gzip de lo que se sube a la nube (ver src/pack.rs)
flate2 = "1"

# Cifrado de extremo a extremo y vinculación de dispositivos (ver src/vault.rs)
aes-gcm = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22"
zeroize = "1"

# Identificador de hardware (clave local sin llavero del sistema; ver src/secret.rs)
machine-uid = "0.5"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
