[package]
name = "caesar"
version = "0.2.19"
description = "Caesar - cliente API rápido y seguro"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
open = "5"
tokio = { version = "1", features = ["rt", "macros", "time", "net", "fs"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart", "gzip", "deflate"] }

# Cifrado de extremo a extremo y vinculación de dispositivos (ver src/vault.rs)
aes-gcm = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22"
zeroize = "1"

# Llavero del sistema operativo (cada plataforma usa el suyo)
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "vendored"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
