name: Release

# · Tag vX.Y.Z (lo crea scripts/release.mjs tras el merge a master) → versión ESTABLE: la ven todos los usuarios.
# · Push a la rama develop → versión de DESARROLLO: se publica como pre-release fija «dev» y solo la reciben
#   quienes activan el canal de desarrollo en Ajustes → Actualizaciones. Nunca pasa a ser la «última» versión estable.
# Compila Windows, Linux y macOS, firma los paquetes del actualizador y publica la Release con latest.json.
on:
  push:
    branches: [develop]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: ubuntu-22.04
            args: "--bundles deb,appimage"
          - os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de Linux (Tauri v2)
        if: matrix.os == 'ubuntu-22.04'
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev \
            build-essential pkg-config file patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Versión de desarrollo: patch siguiente + número de ejecución (0.3.2-57). Es mayor que la estable instalada y menor que
      # la estable siguiente, y es numérica (la exige el instalador MSI de Windows).
      - name: Versión de desarrollo
        if: github.ref_type == 'branch'
        shell: bash
        env:
          RUN: ${{ github.run_number }}
        run: |
          node -e 'const fs=require("fs");const p="src-tauri/tauri.conf.json";const c=JSON.parse(fs.readFileSync(p,"utf8"));const [a,b,d]=c.version.split("-")[0].split(".").map(Number);c.version=a+"."+b+"."+(d+1)+"-"+process.env.RUN;fs.writeFileSync(p,JSON.stringify(c,null,2));console.log(c.version)'

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Firma y notarización de macOS (solo se usan en el runner de macOS; en los demás quedan vacías)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          releaseName: "${{ github.ref_type == 'tag' && format('Caesar {0}', github.ref_name) || 'Caesar (desarrollo)' }}"
          releaseBody: "${{ github.ref_type == 'tag' && 'Instala el paquete de tu sistema. Si ya tienes Caesar con actualizaciones automáticas, se actualizará solo.' || 'Versión de PRUEBA de la rama develop: puede fallar. Solo la reciben quienes activan el canal de desarrollo en Ajustes → Actualizaciones.' }}"
          releaseDraft: true
          prerelease: ${{ github.ref_type == 'branch' }}
          commitish: ${{ github.sha }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # La Release se crea como borrador y solo se publica cuando las tres plataformas han terminado,
  # para que latest.json nunca llegue incompleto (sin Windows) a quien busque actualizaciones.
  publish:
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - name: Publicar la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false --latest
          else
            gh release edit dev --repo "${{ github.repository }}" --draft=false --prerelease --latest=false
          fi
