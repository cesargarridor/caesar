name: Release

# · Tag vX.Y.Z (lo crea scripts/release.mjs tras el merge a master) → versión ESTABLE: se publica en este repositorio
#   y la reciben todos los usuarios (actualización automática).
# · Push a la rama develop → versión BETA: se compila aquí (gratis, repo público) pero se publica en el repositorio
#   PRIVADO cesargarridor/caesar-beta, que solo ven los colaboradores invitados. Necesita el secreto BETA_TOKEN
#   (token con permiso de escritura en ese repo); sin él, develop no compila nada.
# Compila Windows, Linux y macOS, firma los paquetes del actualizador y publica la Release.
on:
  push:
    branches: [develop]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-22.04
    outputs:
      go: ${{ steps.g.outputs.go }}
    env:
      BETA_TOKEN: ${{ secrets.BETA_TOKEN }}
    steps:
      - id: g
        run: |
          if [ "${{ github.ref_type }}" = "tag" ] || [ -n "$BETA_TOKEN" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Beta desactivada: falta el secreto BETA_TOKEN (ver docs/RAMAS.md)."
          fi

  release:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: ubuntu-22.04
            args: "--bundles deb,appimage"
          - os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de Linux (Tauri v2)
        if: matrix.os == 'ubuntu-22.04'
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev \
            build-essential pkg-config file patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Versión beta: patch siguiente + número de ejecución (0.3.2-57). Es numérica (la exige el instalador MSI de Windows),
      # mayor que la estable instalada y menor que la estable siguiente.
      - name: Versión beta
        if: github.ref_type == 'branch'
        shell: bash
        env:
          RUN: ${{ github.run_number }}
        run: |
          node -e 'const fs=require("fs");const p="src-tauri/tauri.conf.json";const c=JSON.parse(fs.readFileSync(p,"utf8"));const [a,b,d]=c.version.split("-")[0].split(".").map(Number);c.version=a+"."+b+"."+(d+1)+"-"+process.env.RUN;fs.writeFileSync(p,JSON.stringify(c,null,2));console.log(c.version)'

      # Notas de la versión (las escribe scripts/release.mjs): salen en la Release y en el aviso de actualización de la app.
      - name: Notas de la versión
        id: notes
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          f="release-notes/${{ github.ref_name }}.md"
          { echo "body<<NOTES_EOF"; if [ -f "$f" ]; then cat "$f"; else echo "- Mejoras y correcciones."; fi; echo "NOTES_EOF"; } >> "$GITHUB_OUTPUT"

      # ── Estable (tag): igual que siempre ──
      - uses: tauri-apps/tauri-action@v0
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CAESAR_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Firma y notarización de macOS (solo se usan en el runner de macOS; en los demás quedan vacías)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Caesar ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # ── Beta (develop): se sube al repositorio privado caesar-beta ──
      - uses: tauri-apps/tauri-action@v0
        if: github.ref_type == 'branch'
        env:
          GITHUB_TOKEN: ${{ secrets.BETA_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CAESAR_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          owner: ${{ github.repository_owner }}
          repo: caesar-beta
          tagName: beta-${{ github.run_number }}
          releaseName: "Caesar beta ${{ github.run_number }}"
          releaseBody: "Versión BETA de prueba (rama develop, ${{ github.sha }}). Puede fallar. No se actualiza sola: instala el paquete de tu sistema."
          releaseDraft: true
          prerelease: true
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  # La Release se crea como borrador y solo se publica cuando las tres plataformas han terminado.
  publish:
    needs: [gate, release]
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Publicar la Release
        env:
          GH_TOKEN: ${{ github.ref_type == 'tag' && secrets.GITHUB_TOKEN || secrets.BETA_TOKEN }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false --latest
          else
            gh release edit "beta-${{ github.run_number }}" --repo "${{ github.repository_owner }}/caesar-beta" --draft=false --prerelease
          fi

  # Snap Store (Ubuntu): solo versiones estables. Reutiliza el .deb de la Release ya publicada.
  # Necesita el secreto SNAPCRAFT_STORE_CREDENTIALS (snapcraft export-login --snaps caesar --channels stable,candidate,beta,edge -).
  snap:
    needs: [gate, publish]
    if: github.ref_type == 'tag' && needs.gate.outputs.go == 'true'
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v4
      - name: Descargar el .deb de la Release
        run: |
          mkdir -p snap/deb
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern '*_amd64.deb' --dir snap/deb
      - name: Versión del snap = tag
        run: |
          sed -i "s|^version: .*|version: '${GITHUB_REF_NAME#v}'|" snap/snapcraft.yaml
      # Snapcraft is installed from the Snap Store by this action. Retry the
      # complete setup/build when the store has a transient connectivity error.
      - uses: snapcore/action-build@v1
        id: build1
        continue-on-error: true
      - uses: snapcore/action-build@v1
        id: build2
        if: steps.build1.outcome != 'success'
        continue-on-error: true
      - uses: snapcore/action-build@v1
        id: build3
        if: steps.build1.outcome != 'success' && steps.build2.outcome != 'success'
      - name: Subir a Snap Store (stable)
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        env:
          SNAP: ${{ steps.build1.outputs.snap || steps.build2.outputs.snap || steps.build3.outputs.snap }}
        run: |
          if [ -z "$SNAP" ]; then
            echo "::error::Snap build failed after 3 attempts."
            exit 1
          fi
          for attempt in 1 2 3; do
            if snapcraft upload "$SNAP" --release stable; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 15))
              echo "::warning::Snap Store upload failed; retrying in ${delay}s (attempt $((attempt + 1))/3)."
              sleep "$delay"
            fi
          done
          echo "::error::Snap Store upload failed after 3 attempts."
          exit 1
