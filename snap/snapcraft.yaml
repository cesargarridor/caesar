name: caesar
base: core22
version: '0.15.0'   # el CI lo sustituye por la versión del tag
title: Caesar
summary: Fast, local-first API client. HTTP, GraphQL, WebSocket, mocks.
website: https://cesargarridor.github.io/caesar/
source-code: https://github.com/cesargarridor/caesar
issues: https://github.com/cesargarridor/caesar/issues
description: |
  Caesar is a fast, secure and local-first desktop API client: a lightweight
  alternative to Postman and Insomnia. Your requests, collections and tokens
  stay on your computer.

  What you can do with Caesar:
  - Send HTTP requests (REST) with params, headers, JSON, form and raw bodies.
  - Paste a cURL command and get the request ready; export any request back
    to cURL or generate code for several languages.
  - Authentication: Bearer, Basic, API key, OAuth and request signing.
  - GraphQL and WebSocket clients built in.
  - Organize everything in collections and folders, with tabs and quick search.
  - Variables and profiles (dev, staging, production) to switch environments
    in one click.
  - Write tests and scripts for your requests and see the results at once.
  - Collection runner with CSV data, and a local mock server.
  - Import from Postman and OpenAPI; export your collections any time.
  - Request history, JSON viewer with copy, and shareable caesar:// links.
  - Optional AI assistant: bring your own key, nothing is sent without it.
  - Command line tool for scripts and CI.
  - Light and dark themes, keyboard shortcuts, and a UI available in several
    languages.

  Caesar Sync (optional subscription) syncs your requests and collections
  across your computers with end-to-end encryption (AES-256-GCM). The key
  never leaves your device's keychain, so nobody else can read your tokens.
  To use the keychain, connect it once with:
  sudo snap connect caesar:password-manager-service

  Caesar works fully offline and needs no account to send requests.
grade: stable
confinement: strict
architectures:
  - build-on: amd64

apps:
  caesar:
    command: usr/bin/caesar
    extensions: [gnome]
    desktop: usr/share/applications/Caesar.desktop
    # WebKit busca sus procesos auxiliares en /usr/lib/...; dentro del snap están bajo $SNAP.
    environment:
      WEBKIT_EXEC_PATH: $SNAP/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1
      WEBKIT_INJECTED_BUNDLE_PATH: $SNAP/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1/injected-bundle
    plugs:
      - network
      - network-bind              # callback local del login con Google
      - home
      - password-manager-service  # keyring (secret service)
      - desktop
      - desktop-legacy
      - wayland
      - x11

# WebKitGTK tiene fija la ruta /usr/lib/<arch>/webkit2gtk-4.1/ (ignora WEBKIT_EXEC_PATH en las builds
# de Ubuntu): se enlaza la copia del snap en esa ruta para que encuentre WebKitNetworkProcess, etc.
layout:
  /usr/lib/x86_64-linux-gnu/webkit2gtk-4.1:
    bind: $SNAP/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1

parts:
  caesar:
    plugin: nil
    # El CI deja el .deb ya compilado de la Release en snap/deb/
    source: snap/deb
    source-type: local
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libayatana-appindicator3-1
      - libsecret-1-0
    # No llevar dentro el Mesa/GPU: la extensión gnome ya lo aporta desde el sistema.
    # Si va dentro, falla con "libEGL fatal: DRI driver not from this Mesa build".
    prime:
      - -usr/lib/*/dri
      - -usr/lib/*/libEGL*
      - -usr/lib/*/libGL.so*
      - -usr/lib/*/libGLX*
      - -usr/lib/*/libGLdispatch*
      - -usr/lib/*/libgbm*
      - -usr/lib/*/libglapi*
      - -usr/lib/*/libdrm*
      - -usr/lib/*/libLLVM*
      - -usr/lib/*/libgallium*
    override-build: |
      dpkg-deb -x "$CRAFT_PART_SRC"/*.deb "$CRAFT_PART_INSTALL"
      # Tauri nombra el binario según productName; se normaliza a usr/bin/caesar
      cd "$CRAFT_PART_INSTALL/usr/bin"
      [ -e caesar ] || ln -s "$(ls | head -n1)" caesar
      # el .desktop de Tauri se llama Caesar.desktop
      cd "$CRAFT_PART_INSTALL/usr/share/applications"
      [ -e Caesar.desktop ] || mv ./*.desktop Caesar.desktop
      sed -i 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/128x128/apps/caesar.png|' Caesar.desktop
